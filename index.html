<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#182526" />
    <meta name="description" content="木构图志 · Timber Atlas：观察佛光寺东大殿的完整结构，逐件拆解斗拱与梁架，沿连接关系学习拼装。" />
    <title data-i18n-preserve>木构图志 · Timber Atlas</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/src/boot.css" />
  </head>
  <body>
    <div id="boot" aria-labelledby="boot-title" data-i18n-preserve>
      <div class="boot-card"><img src="/icon.svg" alt="" width="64" height="64" />
        <h1 id="boot-title" data-i18n-preserve>木构图志 · Timber Atlas</h1>
        <div class="boot-languages" role="group" aria-label="Language / 语言"><button data-boot-language="zh-CN" lang="zh-CN">中文</button><button data-boot-language="en" lang="en">EN</button></div>
        <p id="boot-count">第 1 / 4 步 · 载入模型数据</p>
        <p id="boot-status">正在启动程序…</p>
        <progress id="boot-progress" max="100" aria-label="当前任务进度" aria-describedby="boot-status"></progress>
        <p id="boot-value">处理中</p><p id="boot-detail"></p><p id="boot-completed">已完成 0 / 4 步</p>
        <p id="boot-live" class="boot-sr" role="status" aria-live="polite" aria-atomic="true"></p>
        <button id="boot-retry" hidden>重新加载</button>
        <details id="boot-error" hidden><summary>错误详情</summary><pre></pre></details>
      </div>
    </div>
    <div id="app" inert></div>
    <noscript>三维学习工作区需要 JavaScript，请在浏览器中启用。</noscript>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
